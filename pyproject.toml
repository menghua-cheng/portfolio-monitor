[project]
name = "portfolio-monitor"
version = "0.1.0"
description = "Personal US-stock portfolio monitor: daily moving-average signal report with interactive charts, a signal backtest, and email delivery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-datareader>=0.10",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.scripts]
# Console entry points, so the tool runs from anywhere without PYTHONPATH:
#   uv run portfolio-monitor --send
#   uv run portfolio-monitor-config add NVDA
portfolio-monitor = "portfolio_monitor.pipeline:_cli"
portfolio-monitor-config = "portfolio_monitor.config:_cli"
portfolio-monitor-backtest = "portfolio_monitor.backtest_cli:_cli"
portfolio-monitor-cache = "portfolio_monitor.cache:_cli"
portfolio-monitor-tracker = "portfolio_monitor.tracker_cli:_cli"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: the importable package is src/portfolio_monitor.
packages = ["src/portfolio_monitor"]
