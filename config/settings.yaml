# Program settings (tracked in git). The watchlist itself lives in portfolio.csv.
history_years: 2
ma_periods:
  week: 5
  month: 20
  quarter: 60
  half_year: 120
  year: 240
signals:
  slope_lookback: 10
  flat_threshold_pct: 0.5
  double_window_days: 30
  recent_window_days: 30
backtest:
  # Per-side trading cost in basis points, applied to every fill (entry + exit).
  cost_bps: 5
  # Notional capital for the equity curve; percentage metrics are scale-free.
  starting_cash: 10000
data:
  crosscheck_tolerance_pct: 1.0
